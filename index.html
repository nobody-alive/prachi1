<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Infinite Mario Game</title>
<style>
  body {
    margin: 0;
    background: #5c94fc;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial;
  }
  canvas {
    border: 4px solid black;
    background: skyblue;
  }
</style>
</head>
<body>

<canvas id="game" width="800" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const gravity = 0.6;
let level = 1;

// ---------------- PLAYER ----------------
const player = {
  x: 50, y: 300, w: 30, h: 40,
  dx: 0, dy: 0,
  speed: 4,
  jump: 12,
  grounded: false,
  dir: 1
};

// ---------------- WORLD ----------------
let platforms = [];
let enemies = [];
let fireballs = [];

// ---------------- INPUT ----------------
const keys = {};
document.addEventListener("keydown", e => {
  keys[e.key] = true;

  if (e.key === "f" || e.key === "F") {
    fireballs.push({
      x: player.x + player.w / 2,
      y: player.y + player.h / 2,
      r: 5,
      dx: player.dir * 7
    });
  }
});
document.addEventListener("keyup", e => keys[e.key] = false);

// ---------------- LEVEL GENERATION ----------------
function generateLevel() {
  platforms = [];
  enemies = [];
  fireballs = [];

  // Ground
  platforms.push({ x: 0, y: 360, w: 800, h: 40 });

  // Random platforms
  let platformCount = 3 + Math.floor(level * 0.7);
  for (let i = 0; i < platformCount; i++) {
    platforms.push({
      x: Math.random() * 650 + 50,
      y: Math.random() * 200 + 100,
      w: Math.random() * 100 + 80,
      h: 20
    });
  }

  // Enemies
  let enemyCount = Math.min(2 + level, 10);
  for (let i = 0; i < enemyCount; i++) {
    enemies.push({
      x: Math.random() * 700 + 50,
      y: 330,
      w: 30,
      h: 30,
      dx: Math.random() < 0.5 ? -1.2 : 1.2,
      alive: true
    });
  }

  // Reset player
  player.x = 50;
  player.y = 300;
  player.dy = 0;
}

generateLevel();

// ---------------- UPDATE ----------------
function update() {
  player.dx = 0;
  if (keys["ArrowLeft"]) {
    player.dx = -player.speed;
    player.dir = -1;
  }
  if (keys["ArrowRight"]) {
    player.dx = player.speed;
    player.dir = 1;
  }

  if ((keys["ArrowUp"] || keys[" "]) && player.grounded) {
    player.dy = -player.jump;
    player.grounded = false;
  }

  player.dy += gravity;
  player.x += player.dx;
  player.y += player.dy;

  // Platform collisions
  player.grounded = false;
  platforms.forEach(p => {
    if (
      player.x < p.x + p.w &&
      player.x + player.w > p.x &&
      player.y + player.h <= p.y + 10 &&
      player.y + player.h + player.dy >= p.y
    ) {
      player.dy = 0;
      player.y = p.y - player.h;
      player.grounded = true;
    }
  });

  // Boundaries
  if (player.x < 0) player.x = 0;
  if (player.x + player.w > canvas.width)
    player.x = canvas.width - player.w;

  // Enemies
  enemies.forEach(e => {
    if (!e.alive) return;
    e.x += e.dx;

    if (e.x < 0 || e.x + e.w > canvas.width)
      e.dx *= -1;

    // Player collision
    if (
      player.x < e.x + e.w &&
      player.x + player.w > e.x &&
      player.y < e.y + e.h &&
      player.y + player.h > e.y
    ) {
      if (player.dy > 0) {
        e.alive = false;
        player.dy = -8;
      } else {
        gameOver();
      }
    }
  });

  // Fireballs
  fireballs.forEach((f, i) => {
    f.x += f.dx;

    if (f.x < 0 || f.x > canvas.width)
      fireballs.splice(i, 1);

    enemies.forEach(e => {
      if (!e.alive) return;
      if (
        f.x > e.x &&
        f.x < e.x + e.w &&
        f.y > e.y &&
        f.y < e.y + e.h
      ) {
        e.alive = false;
        fireballs.splice(i, 1);
      }
    });
  });

  // Level cleared
  if (enemies.every(e => !e.alive)) {
    level++;
    generateLevel();
  }

  // Fall death
  if (player.y > canvas.height)
    gameOver();
}

// ---------------- DRAW ----------------
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Player
  ctx.fillStyle = "red";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // Platforms
  ctx.fillStyle = "green";
  platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

  // Enemies
  ctx.fillStyle = "brown";
  enemies.forEach(e => {
    if (e.alive)
      ctx.fillRect(e.x, e.y, e.w, e.h);
  });

  // Fireballs
  ctx.fillStyle = "orange";
  fireballs.forEach(f => {
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fill();
  });

  // HUD
  ctx.fillStyle = "black";
  ctx.font = "18px Arial";
  ctx.fillText("Level: " + level, 10, 25);
}

// ---------------- LOOP ----------------
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function gameOver() {
  alert("Game Over! Reached Level " + level);
  location.reload();
}

loop();
</script>

</body>
</html>
