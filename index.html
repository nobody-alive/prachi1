<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mario Style Game</title>
<style>
  body {
    margin: 0;
    background: #5c94fc;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  canvas {
    border: 4px solid black;
    background: skyblue;
  }
</style>
</head>
<body>

<canvas id="game" width="800" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// ---------------- PLAYER ----------------
const player = {
  x: 50,
  y: 300,
  w: 30,
  h: 40,
  dx: 0,
  dy: 0,
  speed: 4,
  jump: 12,
  grounded: false,
  direction: 1 // 1 = right, -1 = left
};

// ---------------- WORLD ----------------
const gravity = 0.6;
const platforms = [
  {x:0, y:360, w:800, h:40},
  {x:200, y:280, w:120, h:20},
  {x:400, y:230, w:120, h:20},
  {x:600, y:180, w:120, h:20}
];

// ---------------- ENEMIES ----------------
let enemies = [
  {x: 500, y: 330, w: 30, h: 30, dx: -1.2, alive: true},
  {x: 650, y: 330, w: 30, h: 30, dx: 1.2, alive: true}
];

// ---------------- FIREBALLS ----------------
let fireballs = [];

// ---------------- INPUT ----------------
const keys = {};
document.addEventListener("keydown", e => {
  keys[e.key] = true;

  // Shoot fireball
  if (e.key === "f" || e.key === "F") {
    fireballs.push({
      x: player.x + player.w / 2,
      y: player.y + player.h / 2,
      r: 5,
      dx: player.direction * 7
    });
  }
});
document.addEventListener("keyup", e => keys[e.key] = false);

// ---------------- UPDATE ----------------
function update() {
  // Movement
  player.dx = 0;
  if (keys["ArrowLeft"]) {
    player.dx = -player.speed;
    player.direction = -1;
  }
  if (keys["ArrowRight"]) {
    player.dx = player.speed;
    player.direction = 1;
  }

  if ((keys["ArrowUp"] || keys[" "]) && player.grounded) {
    player.dy = -player.jump;
    player.grounded = false;
  }

  player.dy += gravity;
  player.x += player.dx;
  player.y += player.dy;

  // Platform collisions
  player.grounded = false;
  platforms.forEach(p => {
    if (
      player.x < p.x + p.w &&
      player.x + player.w > p.x &&
      player.y + player.h <= p.y + 10 &&
      player.y + player.h + player.dy >= p.y
    ) {
      player.dy = 0;
      player.y = p.y - player.h;
      player.grounded = true;
    }
  });

  // Boundaries
  if (player.x < 0) player.x = 0;
  if (player.x + player.w > canvas.width)
    player.x = canvas.width - player.w;

  // ---------------- ENEMY LOGIC ----------------
  enemies.forEach(enemy => {
    if (!enemy.alive) return;

    enemy.x += enemy.dx;

    // Bounce off edges
    if (enemy.x < 0 || enemy.x + enemy.w > canvas.width)
      enemy.dx *= -1;

    // Player vs Enemy
    if (
      player.x < enemy.x + enemy.w &&
      player.x + player.w > enemy.x &&
      player.y < enemy.y + enemy.h &&
      player.y + player.h > enemy.y
    ) {
      // Jump kill
      if (player.dy > 0) {
        enemy.alive = false;
        player.dy = -8;
      } else {
        gameOver();
      }
    }
  });

  // ---------------- FIREBALL LOGIC ----------------
  fireballs.forEach((f, i) => {
    f.x += f.dx;

    // Remove offscreen
    if (f.x < 0 || f.x > canvas.width)
      fireballs.splice(i, 1);

    // Hit enemy
    enemies.forEach(enemy => {
      if (!enemy.alive) return;
      if (
        f.x > enemy.x &&
        f.x < enemy.x + enemy.w &&
        f.y > enemy.y &&
        f.y < enemy.y + enemy.h
      ) {
        enemy.alive = false;
        fireballs.splice(i, 1);
      }
    });
  });

  // Fall death
  if (player.y > canvas.height) gameOver();
}

// ---------------- DRAW ----------------
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Player
  ctx.fillStyle = "red";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // Platforms
  ctx.fillStyle = "green";
  platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

  // Enemies
  ctx.fillStyle = "brown";
  enemies.forEach(e => {
    if (e.alive)
      ctx.fillRect(e.x, e.y, e.w, e.h);
  });

  // Fireballs
  ctx.fillStyle = "orange";
  fireballs.forEach(f => {
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

// ---------------- GAME LOOP ----------------
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function gameOver() {
  alert("Game Over!");
  location.reload();
}

loop();
</script>

</body>
</html>
